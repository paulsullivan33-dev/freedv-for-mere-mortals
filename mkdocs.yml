site_name: FreeDV for Mere Mortals
site_description: Digital voice for HF amateur radio. How FreeDV squeezes a voice into a few hundred bits per second with the open Codec2 codec, how a real signal is built and decoded with checks you can run yourself, and what it takes to put that signal on the air, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/freedv-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

